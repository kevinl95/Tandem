<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tandem Receiver</title>
    <style>
      html,
      body {
        background: #0b1120;
        color: #f9fafb;
        font-family: Arial, sans-serif;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      video {
        background: black;
        height: 100%;
        inset: 0;
        object-fit: contain;
        position: fixed;
        visibility: hidden;
        width: 100%;
      }

      body.streaming video {
        visibility: visible;
      }

      body.streaming #pairing {
        display: none;
      }

      #pairing {
        align-items: center;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        height: 100%;
        justify-content: center;
        padding: 48px;
        text-align: center;
      }

      h1 {
        font-size: 40px;
        font-weight: 600;
        letter-spacing: 0.08em;
        margin: 0 0 48px;
        opacity: 0.8;
      }

      #instructions {
        font-size: 32px;
        margin: 0 0 24px;
      }

      #session-code {
        font-family: "Courier New", monospace;
        font-size: 128px;
        font-weight: 700;
        letter-spacing: 0.2em;
        margin: 0 0 48px;
      }

      #receiver-status {
        color: #9ca3af;
        font-size: 28px;
        margin: 0;
      }

      #receiver-status.problem {
        color: #fca5a5;
      }

      #probe-link {
        bottom: 32px;
        color: #93c5fd;
        font-size: 22px;
        position: fixed;
        right: 48px;
      }

      #probe-link:focus {
        outline: 3px solid #93c5fd;
        outline-offset: 4px;
      }

      body.streaming #probe-link {
        display: none;
      }
    </style>
  </head>
  <body>
    <video id="receiver-video" aria-label="Mirrored screen" autoplay playsinline></video>

    <main id="pairing">
      <h1>TANDEM</h1>
      <p id="instructions">To share your screen, open the Tandem sender and enter</p>
      <p id="session-code" aria-label="Pairing code">······</p>
      <p id="receiver-status" role="status" aria-live="polite">Starting…</p>
    </main>

    <a id="probe-link" href="../probe/">Run WebRTC diagnostics</a>

    <script type="module" src="./app.js"></script>
  </body>
</html>
