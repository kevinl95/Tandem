<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tandem Screen Share</title>
    <style>
      html,
      body {
        background: #0b1120;
        color: #f9fafb;
        font-family: Arial, sans-serif;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      video {
        background: black;
        height: 100%;
        inset: 0;
        object-fit: contain;
        position: fixed;
        visibility: hidden;
        width: 100%;
      }

      body.streaming video {
        visibility: visible;
      }

      body.streaming #pairing {
        display: none;
      }

      body.paused #session-code,
      body.paused #instructions {
        opacity: 0.35;
      }

      #pairing {
        align-items: center;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        height: 100%;
        justify-content: center;
        padding: 48px;
        text-align: center;
      }

      h1 {
        font-size: 40px;
        font-weight: 600;
        letter-spacing: 0.08em;
        margin: 0 0 48px;
        opacity: 0.8;
      }

      #instructions {
        font-size: 32px;
        margin: 0 0 24px;
      }

      #session-code {
        font-family: "Courier New", monospace;
        font-size: 128px;
        font-weight: 700;
        letter-spacing: 0.2em;
        margin: 0 0 48px;
      }

      #receiver-status {
        color: #9ca3af;
        font-size: 28px;
        margin: 0;
      }

      #receiver-status.problem {
        color: #fca5a5;
      }

      #tv-actions {
        bottom: 32px;
        display: flex;
        gap: 32px;
        position: fixed;
        right: 48px;
      }

      #tv-actions a,
      #tv-actions button {
        background: none;
        border: none;
        color: #93c5fd;
        font: inherit;
        font-size: 22px;
        padding: 4px;
      }

      #tv-actions a:focus,
      #tv-actions button:focus {
        outline: 3px solid #93c5fd;
        outline-offset: 4px;
      }

      body.streaming #tv-actions {
        display: none;
      }

      #receiver-name {
        font-size: 36px;
        margin: 0 0 16px;
      }

      #approval,
      #devices {
        background: rgba(11, 17, 32, 0.94);
        border: 2px solid #374151;
        border-radius: 24px;
        box-sizing: border-box;
        left: 50%;
        max-width: 1100px;
        padding: 48px 56px;
        position: fixed;
        text-align: center;
        top: 50%;
        transform: translate(-50%, -50%);
        width: calc(100% - 96px);
      }

      #approval[hidden],
      #devices[hidden] {
        display: none;
      }

      #approval h2,
      #devices h2 {
        font-size: 44px;
        margin: 0 0 16px;
        overflow-wrap: anywhere;
      }

      #approval p {
        color: #d1d5db;
        font-size: 28px;
        margin: 0 0 40px;
      }

      #approval p.warning {
        color: #fcd34d;
      }

      #approval .actions,
      #devices .actions {
        display: flex;
        gap: 32px;
        justify-content: center;
      }

      #approval button,
      #devices button {
        background: #1f2937;
        border: 3px solid transparent;
        border-radius: 16px;
        color: #f9fafb;
        font: inherit;
        font-size: 32px;
        min-width: 240px;
        padding: 20px 40px;
      }

      #approval button:focus,
      #devices button:focus {
        background: #2563eb;
        border-color: #bfdbfe;
        outline: none;
      }

      #devices-list {
        list-style: none;
        margin: 0 0 32px;
        max-height: 520px;
        overflow-y: auto;
        padding: 0;
        text-align: left;
      }

      #devices-list li {
        align-items: center;
        border-bottom: 1px solid #374151;
        display: flex;
        font-size: 28px;
        gap: 24px;
        justify-content: space-between;
        padding: 12px 0;
      }

      #devices-list .blocked {
        color: #fca5a5;
      }

      #devices-list button {
        font-size: 24px;
        min-width: 180px;
        padding: 12px 24px;
      }

      #devices-empty {
        color: #9ca3af;
        font-size: 28px;
        margin: 0 0 32px;
      }
    </style>
  </head>
  <body>
    <video id="receiver-video" aria-label="Mirrored screen" autoplay playsinline></video>

    <main id="pairing">
      <h1>TANDEM SCREEN SHARE</h1>
      <p id="receiver-name"></p>
      <p id="instructions">On a device on this WiFi, open Tandem and pick this TV, or enter</p>
      <p id="session-code" aria-label="Pairing code">······</p>
      <p id="receiver-status" role="status" aria-live="polite">Starting…</p>
    </main>

    <nav id="tv-actions" aria-label="TV options">
      <button id="manage-devices" type="button">Allowed devices</button>
      <a id="probe-link" href="../probe/">Run WebRTC diagnostics</a>
    </nav>

    <section id="approval" role="alertdialog" aria-labelledby="approval-title" aria-describedby="approval-detail" hidden>
      <h2 id="approval-title"></h2>
      <p id="approval-detail"></p>
      <div class="actions">
        <button id="approval-allow" type="button">Allow</button>
        <button id="approval-decline" type="button">Decline</button>
        <button id="approval-block" type="button">Block</button>
      </div>
    </section>

    <section id="devices" role="dialog" aria-labelledby="devices-title" hidden>
      <h2 id="devices-title">Allowed devices</h2>
      <ul id="devices-list"></ul>
      <p id="devices-empty">No devices have been allowed or blocked yet.</p>
      <div class="actions">
        <button id="devices-forget-all" type="button">Forget all</button>
        <button id="devices-close" type="button">Close</button>
      </div>
    </section>

    <script type="module" src="./app.js"></script>
  </body>
</html>
