<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tandem Receiver</title>
    <style>
      html,
      body {
        background: #0b1120;
        color: #f9fafb;
        font-family: Arial, sans-serif;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      video {
        background: black;
        height: 100%;
        inset: 0;
        object-fit: contain;
        position: fixed;
        visibility: hidden;
        width: 100%;
      }

      body.streaming video {
        visibility: visible;
      }

      body.streaming #pairing {
        display: none;
      }

      body.paused #session-code,
      body.paused #instructions {
        opacity: 0.35;
      }

      #pairing {
        align-items: center;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        height: 100%;
        justify-content: center;
        padding: 48px;
        text-align: center;
      }

      h1 {
        font-size: 40px;
        font-weight: 600;
        letter-spacing: 0.08em;
        margin: 0 0 48px;
        opacity: 0.8;
      }

      #instructions {
        font-size: 32px;
        margin: 0 0 24px;
      }

      #session-code {
        font-family: "Courier New", monospace;
        font-size: 128px;
        font-weight: 700;
        letter-spacing: 0.2em;
        margin: 0 0 48px;
      }

      #receiver-status {
        color: #9ca3af;
        font-size: 28px;
        margin: 0;
      }

      #receiver-status.problem {
        color: #fca5a5;
      }

      #probe-link {
        bottom: 32px;
        color: #93c5fd;
        font-size: 22px;
        position: fixed;
        right: 48px;
      }

      #probe-link:focus {
        outline: 3px solid #93c5fd;
        outline-offset: 4px;
      }

      body.streaming #probe-link {
        display: none;
      }

      #receiver-name {
        font-size: 36px;
        margin: 0 0 16px;
      }

      #approval {
        background: rgba(11, 17, 32, 0.94);
        border: 2px solid #374151;
        border-radius: 24px;
        box-sizing: border-box;
        left: 50%;
        max-width: 1100px;
        padding: 48px 56px;
        position: fixed;
        text-align: center;
        top: 50%;
        transform: translate(-50%, -50%);
        width: calc(100% - 96px);
      }

      #approval[hidden] {
        display: none;
      }

      #approval h2 {
        font-size: 44px;
        margin: 0 0 16px;
        overflow-wrap: anywhere;
      }

      #approval p {
        color: #d1d5db;
        font-size: 28px;
        margin: 0 0 40px;
      }

      #approval p.warning {
        color: #fcd34d;
      }

      #approval .actions {
        display: flex;
        gap: 32px;
        justify-content: center;
      }

      #approval button {
        background: #1f2937;
        border: 3px solid transparent;
        border-radius: 16px;
        color: #f9fafb;
        font: inherit;
        font-size: 32px;
        min-width: 240px;
        padding: 20px 40px;
      }

      #approval button:focus {
        background: #2563eb;
        border-color: #bfdbfe;
        outline: none;
      }
    </style>
  </head>
  <body>
    <video id="receiver-video" aria-label="Mirrored screen" autoplay playsinline></video>

    <main id="pairing">
      <h1>TANDEM</h1>
      <p id="receiver-name"></p>
      <p id="instructions">On a device on this WiFi, open Tandem and pick this TV, or enter</p>
      <p id="session-code" aria-label="Pairing code">······</p>
      <p id="receiver-status" role="status" aria-live="polite">Starting…</p>
    </main>

    <a id="probe-link" href="../probe/">Run WebRTC diagnostics</a>

    <section id="approval" role="alertdialog" aria-labelledby="approval-title" aria-describedby="approval-detail" hidden>
      <h2 id="approval-title"></h2>
      <p id="approval-detail"></p>
      <div class="actions">
        <button id="approval-allow" type="button">Allow</button>
        <button id="approval-decline" type="button">Decline</button>
      </div>
    </section>

    <script type="module" src="./app.js"></script>
  </body>
</html>
