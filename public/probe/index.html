<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tandem WebRTC Probe</title>
    <style>
      body {
        background: #111827;
        color: #f9fafb;
        font-family: Arial, sans-serif;
        font-size: 24px;
        margin: 0;
        padding: 32px 48px;
      }

      #results {
        font-family: monospace;
        list-style: none;
        padding: 0;
      }

      #results li {
        margin: 8px 0;
        overflow-wrap: anywhere;
      }

      .pass { color: #4ade80; }
      .warn { color: #facc15; }
      .fail { color: #f87171; }
      .info { color: #9ca3af; }

      video {
        background: black;
        height: 180px;
        width: 320px;
      }

      a {
        color: #93c5fd;
      }

      a:focus {
        outline: 3px solid #93c5fd;
      }
    </style>
  </head>
  <body>
    <h1>Tandem WebRTC Probe</h1>
    <p id="summary" role="status" aria-live="polite">Running checks…</p>
    <ul id="results"></ul>
    <video id="loopback-video" aria-label="Loopback test video" autoplay muted playsinline></video>
    <p><a id="back-link" href="../receiver/">Back to receiver</a></p>

    <script src="./probe.js"></script>
  </body>
</html>
