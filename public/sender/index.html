<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tandem Sender</title>
    <style>
      body {
        background: #111827;
        color: #f9fafb;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 24px;
      }

      main {
        display: grid;
        gap: 20px;
        margin: 0 auto;
        max-width: 720px;
      }

      label {
        display: grid;
        gap: 6px;
      }

      input,
      button {
        border-radius: 8px;
        border: 1px solid #374151;
        box-sizing: border-box;
        font: inherit;
        padding: 12px;
      }

      #session-code {
        font-family: "Courier New", monospace;
        font-size: 28px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      #session-code::placeholder {
        font-family: Arial, sans-serif;
        font-size: 18px;
        letter-spacing: normal;
        text-transform: none;
      }

      label.checkbox {
        align-items: center;
        display: flex;
        gap: 10px;
      }

      label.checkbox input {
        height: 20px;
        width: 20px;
      }

      .actions {
        display: flex;
        gap: 12px;
      }

      button {
        background: #2563eb;
        color: white;
        cursor: pointer;
      }

      button:disabled {
        cursor: default;
        opacity: 0.5;
      }

      #stop-sharing {
        background: #4b5563;
      }

      #sender-status.problem {
        color: #fca5a5;
      }

      video {
        background: black;
        border-radius: 12px;
        width: 100%;
      }

      dl {
        display: grid;
        gap: 6px 16px;
        grid-template-columns: max-content 1fr;
        margin: 0;
      }

      dt {
        color: #9ca3af;
      }

      dd {
        font-family: monospace;
        margin: 0;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tandem Sender</h1>

      <label>
        Code shown on the TV
        <input id="session-code" autocomplete="off" maxlength="7" placeholder="Type the TV's code" />
      </label>

      <label class="checkbox">
        <input id="share-audio" type="checkbox" checked />
        Include sound (plays on the TV instead of this computer)
      </label>

      <details id="settings">
        <summary>Settings</summary>
        <label>
          Signaling endpoint
          <input id="signaling-endpoint" placeholder="wss://example.execute-api.us-west-2.amazonaws.com/prod" />
        </label>
      </details>

      <div class="actions">
        <button id="start-sharing">Share screen</button>
        <button id="stop-sharing" disabled>Stop</button>
      </div>

      <p id="sender-status" role="status" aria-live="polite">Enter the code shown on the TV.</p>

      <video id="preview" aria-label="Preview of your shared screen" autoplay muted playsinline></video>

      <section aria-labelledby="stats-heading">
        <h2 id="stats-heading">Connection</h2>
        <dl id="stats"></dl>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
