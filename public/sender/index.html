<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tandem Sender</title>
    <style>
      body {
        background: #111827;
        color: #f9fafb;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 24px 16px;
      }

      main {
        display: grid;
        gap: 20px;
        margin: 0 auto;
        max-width: 720px;
      }

      h1,
      h2 {
        margin: 0;
      }

      h2 {
        font-size: 18px;
      }

      label {
        display: grid;
        gap: 6px;
      }

      input,
      button {
        border-radius: 8px;
        border: 1px solid #374151;
        box-sizing: border-box;
        font: inherit;
        padding: 12px;
      }

      button {
        background: #2563eb;
        color: white;
        cursor: pointer;
      }

      button:disabled {
        cursor: default;
        opacity: 0.5;
      }

      #tv-list {
        display: grid;
        gap: 10px;
        list-style: none;
        margin: 0;
        padding: 0;
      }

      #tv-list button {
        align-items: center;
        background: #1f2937;
        display: flex;
        font-size: 18px;
        justify-content: space-between;
        padding: 16px;
        text-align: left;
        width: 100%;
      }

      #tv-list button:hover:not(:disabled) {
        background: #273449;
      }

      #tv-list .code {
        color: #9ca3af;
        font-family: "Courier New", monospace;
        letter-spacing: 0.1em;
      }

      #tv-list-empty {
        color: #9ca3af;
        margin: 0;
      }

      .code-entry {
        display: flex;
        gap: 12px;
      }

      #session-code {
        flex: 1;
        font-family: "Courier New", monospace;
        font-size: 22px;
        letter-spacing: 0.2em;
        min-width: 0;
        text-transform: uppercase;
      }

      #session-code::placeholder {
        font-family: Arial, sans-serif;
        font-size: 16px;
        letter-spacing: normal;
        text-transform: none;
      }

      label.checkbox {
        align-items: center;
        display: flex;
        gap: 10px;
      }

      label.checkbox input {
        height: 20px;
        width: 20px;
      }

      #stop-sharing {
        background: #4b5563;
        justify-self: start;
      }

      #sender-status.problem {
        color: #fca5a5;
      }

      details {
        display: grid;
        gap: 12px;
      }

      details[open] summary {
        margin-bottom: 12px;
      }

      details label + label {
        margin-top: 12px;
      }

      video {
        background: black;
        border-radius: 12px;
        width: 100%;
      }

      video:not([data-active]) {
        display: none;
      }

      dl {
        display: grid;
        gap: 6px 16px;
        grid-template-columns: max-content 1fr;
        margin: 0;
      }

      dt {
        color: #9ca3af;
      }

      dd {
        font-family: monospace;
        margin: 0;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tandem</h1>

      <section aria-labelledby="tv-heading">
        <h2 id="tv-heading">TVs on your network</h2>
        <p id="tv-list-empty" role="status" aria-live="polite">Looking for TVs…</p>
        <ul id="tv-list"></ul>
      </section>

      <label>
        Or enter the code shown on the TV
        <span class="code-entry">
          <input id="session-code" autocomplete="off" maxlength="7" placeholder="Type the TV's code" />
          <button id="share-code" type="button">Share</button>
        </span>
      </label>

      <label class="checkbox">
        <input id="share-audio" type="checkbox" checked />
        Include sound (plays on the TV instead of this computer)
      </label>

      <p id="sender-status" role="status" aria-live="polite"></p>
      <button id="stop-sharing" type="button" hidden>Stop sharing</button>

      <video id="preview" aria-label="Preview of your shared screen" autoplay muted playsinline></video>

      <section id="stats-section" aria-labelledby="stats-heading" hidden>
        <h2 id="stats-heading">Connection</h2>
        <dl id="stats"></dl>
      </section>

      <details id="settings">
        <summary>Settings</summary>
        <label>
          This device's name (shown on the TV)
          <input id="device-name" maxlength="40" />
        </label>
        <label>
          Signaling endpoint
          <input id="signaling-endpoint" placeholder="wss://example.execute-api.us-west-2.amazonaws.com/prod" />
        </label>
      </details>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
